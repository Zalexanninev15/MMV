name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # No gradle-wrapper.jar is committed (it is a binary blob), so Gradle comes from
      # the action instead. Run `gradle wrapper` once locally if you want ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Without this the APK is signed with a debug key the runner generates fresh on every
      # run, so no two builds share a signature and each one has to be installed over an
      # uninstall. With it, every build updates the last cleanly.
      # The presence check runs in the shell, not in an `if:` — the `secrets` context is not
      # available in step-level conditions. Passing the value through `env` also keeps it out
      # of the script text, so a password containing quotes or $ cannot break the step.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mmv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/mmv.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded."
          else
            echo "No KEYSTORE_B64 secret set."
          fi

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Collect and name APKs
        run: |
          set -eu
          mkdir -p out
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          SHA="${GITHUB_SHA::7}"
          for f in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$f")
            # app-arm64-v8a-release.apk -> arm64-v8a ; app-universal-release.apk -> universal
            abi=$(echo "$name" | sed -e 's/^app-//' -e 's/-release[^.]*\.apk$//')
            cp "$f" "out/magic-music-v-${VERSION}-${abi}-${SHA}.apk"
          done
          ls -la out

      - name: Report signing status
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            echo "Signed with the release keystore."
          else
            echo "::warning::No KEYSTORE_B64 secret set - APKs are debug-signed and their signature changes every run."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: magic-music-v-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
