name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mmv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/mmv.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded."
          else
            echo "No KEYSTORE_B64 secret set."
          fi

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Collect and name APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          SHA="${GITHUB_SHA::7}"

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)

          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APK files found."
            exit 1
          fi

          for f in "${apks[@]}"; do
            name=$(basename "$f")
            abi=$(echo "$name" | sed -e 's/^app-//' -e 's/-release[^.]*\.apk$//')
            cp "$f" "out/magic-music-v-${VERSION}-${abi}-${SHA}.apk"
          done

          ls -lh out

      - name: Report signing status
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            echo "Signed with the release keystore."
          else
            echo "::warning::No KEYSTORE_B64 secret set - APKs may be debug-signed or unsigned, depending on Gradle configuration."
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magic-music-v-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 1